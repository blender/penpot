name: Build and Publish
run-name: Build and publish Penpot Docker images for ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (e.g. 2.16.2 or 2.16.2-blender)'
        required: true
  push:
    tags:
      - '*'

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/images/Dockerfile.backend
          - component: frontend
            dockerfile: docker/images/Dockerfile.frontend
          - component: exporter
            dockerfile: docker/images/Dockerfile.exporter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Build ${{ matrix.component }} bundle
        run: ./manage.sh build-${{ matrix.component }}-bundle

      - name: Move bundle into Docker context
        run: mv bundles/${{ matrix.component }} docker/images/bundle-${{ matrix.component }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ env.REF }}
            type=sha,prefix=

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/images/
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}/${{ matrix.component }}:buildcache,mode=max
